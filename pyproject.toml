[project]
name = "volatility-lab"
version = "0.1.0"
description = "Bayesian option pricing, volatility-model uncertainty and delta-hedging risk (educational research project)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Volatility Lab author" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volatility_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: longer statistical tests (Monte Carlo coverage etc.)",
]
